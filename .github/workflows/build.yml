name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore StateTest1.sln

      - name: Build
        run: dotnet build StateTest1.sln -c Release --no-restore

      - name: Test
        run: dotnet test StateTest1.sln -c Release --no-build
